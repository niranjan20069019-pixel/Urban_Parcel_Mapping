model:
  name: landuse_segformer
  architecture: segformer
  encoder: mit_b2
  num_classes: 8
  class_mapping:
    0: background
    1: residential
    2: commercial
    3: industrial
    4: vegetation
    5: water
    6: bare_land
    7: road
  checkpoint: models/checkpoints/landuse/model.pth
  device: auto
  input_size: [512, 512]
  threshold: 0.5
